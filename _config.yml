title: 大模型技术地图
description: 面向大模型方向的完整技术知识目录 · LLM 全栈学习清单
theme: jekyll-theme-cayman
markdown: GFM
commonmark:
  # UNSAFE：放行 raw HTML（页面末尾的 Mermaid script）；SMART/FOOTNOTES 对齐 github.com 渲染行为
  options: ["UNSAFE", "SMART", "FOOTNOTES"]
  # 不启用 tagfilter，否则 Mermaid 的 <script> 会被转义；tasklist 让 - [ ] 渲染成复选框
  extensions: ["strikethrough", "autolink", "table", "tasklist"]
exclude:
  - README.md
