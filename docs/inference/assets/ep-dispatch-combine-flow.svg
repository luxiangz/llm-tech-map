<rect x="2340" y="355" width="150" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1"/>
<rect x="1920" y="253" width="100" height="60" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1"/>
<text x="720" y="67" font-size="19" font-weight="bold" text-anchor="middle" fill="#1a2332">EP 引入后的 MoE：dispatch / combine 完整过程（Sparse MoE 的多卡视图）</text>
<text x="670" y="384" font-size="13" text-anchor="middle" fill="#1a2332"></text>
<text x="104" y="127" font-size="15" font-weight="bold" fill="#1a2332">GPU0 · token 所在 rank（Attention 输出后）</text>
<text x="560" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a2332">x</text>
<text x="560" y="194" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a2332">[B, T, d_model]</text>
<text x="550" y="295" font-size="13" text-anchor="middle" fill="#1a2332">Router</text>
<text x="550" y="313" font-size="13" text-anchor="middle" fill="#1a2332">logits = x·W_r → [B, T, N]</text>
<text x="550" y="424" font-size="14" text-anchor="middle" fill="#1a2332">softmax(logits)</text>
<text x="550" y="536" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">TopK → 逻辑路由</text>
<text x="550" y="554" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">每 token 得 (专家号, gᵢ)</text>
<text x="550" y="572" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">在本 rank 完成，无需通信</text>
<text x="1095" y="232" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">Shared Expert(s)</text>
<text x="1095" y="250" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">每个 rank 完整持有</text>
<text x="1095" y="268" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">token 本地计算</text>
<text x="1095" y="286" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">不参与 dispatch / combine</text>
<text x="560" y="737" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">DISPATCH all-to-all</text>
<text x="560" y="755" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">token 按计数/偏移发往专家所在 rank</text>
<text x="760" y="728" font-size="12" fill="#1a2332">先行：计数向量交换（每对 rank 一个整数，设备侧完成）</text>
<text x="760" y="746" font-size="12" fill="#1a2332">随后：token 本体按偏移写入对端缓冲；</text>
<text x="760" y="762" font-size="12" fill="#1a2332">shared expert 旁路不走此通道</text>
<text x="670" y="964" font-size="13" text-anchor="middle" fill="#1a2332"></text>
<text x="104" y="837" font-size="15" font-weight="bold" fill="#1a2332">GPU1 · 专家 E₂/E₅ 所在 rank（专家权重固定不动，动的是 token）</text>
<text x="185" y="895" font-size="13" text-anchor="middle" fill="#1a2332">E₁</text>
<text x="185" y="913" font-size="13" text-anchor="middle" fill="#1a2332">[B, T, d_model]</text>
<text x="375" y="895" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">E₂ ✓</text>
<text x="375" y="913" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">[B, T, d_model]</text>
<text x="565" y="895" font-size="13" text-anchor="middle" fill="#1a2332">E₃</text>
<text x="565" y="913" font-size="13" text-anchor="middle" fill="#1a2332">[B, T, d_model]</text>
<text x="755" y="895" font-size="13" text-anchor="middle" fill="#1a2332">E₄</text>
<text x="755" y="913" font-size="13" text-anchor="middle" fill="#1a2332">[B, T, d_model]</text>
<text x="945" y="895" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">E₅ ✓</text>
<text x="945" y="913" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">[B, T, d_model]</text>
<text x="1135" y="895" font-size="13" text-anchor="middle" fill="#1a2332">E₆</text>
<text x="1135" y="913" font-size="13" text-anchor="middle" fill="#1a2332">[B, T, d_model]</text>
<text x="670" y="976" font-size="13" text-anchor="middle" fill="#1a2332">grouped GEMM：对落地 token 按专家分组计算 gate/up → SiLU ⊙ up → down（内部展开见右侧面板）</text>
<text x="560" y="1177" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">COMBINE all-to-all</text>
<text x="560" y="1195" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">专家输出送回 token 原所在 rank</text>
<text x="660" y="1296" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a2332">Weighted Sum（回到源 rank）</text>
<text x="660" y="1314" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a2332">y = Σ gᵢ·Eᵢ(x) + E_shared(x)</text>
<text x="660" y="1334" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a2332">[B, T, d_model]</text>
<text x="660" y="1425" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a2332">y</text>
<text x="660" y="1444" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a2332">[B, T, d_model]</text>
<text x="1955" y="394" font-size="13" text-anchor="middle" fill="#1a2332"></text>
<text x="1920" y="144" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a2332">展开：grouped GEMM 内部 = 每个专家的 SwiGLU（与 Sparse MoE 页一致）</text>
<text x="1950" y="203" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a2332">E(x) = W_down · ( SiLU(W_gate·x) ⊙ (W_up·x) )</text>
<text x="1525" y="287" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">落地 token</text>
<text x="1760" y="278" font-size="13" text-anchor="middle" fill="#1a2332">gate_proj</text>
<text x="1760" y="296" font-size="13" text-anchor="middle" fill="#1a2332">[d_model, d_ff]</text>
<text x="1760" y="380" font-size="13" text-anchor="middle" fill="#1a2332">up_proj</text>
<text x="1760" y="398" font-size="13" text-anchor="middle" fill="#1a2332">[d_model, d_ff]</text>
<text x="1970" y="288" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a2332">SiLU</text>
<text x="1970" y="392" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a2332">⊙</text>
<text x="2180" y="380" font-size="13" text-anchor="middle" fill="#1a2332">down_proj</text>
<text x="2180" y="398" font-size="13" text-anchor="middle" fill="#1a2332">[d_ff, d_model]</text>
<text x="2415" y="380" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">E(x)</text>
<text x="2415" y="398" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a2332">[n_e, d_model]</text>
<text x="1450" y="514" font-size="13" fill="#1a2332">DISPATCH 展开：</text>
<text x="1450" y="532" font-size="13" fill="#1a2332">① 各 rank 在设备上把 topk 结果归约为「每目标 rank 计数」（G 维直方图）；</text>
<text x="1450" y="550" font-size="13" fill="#1a2332">② 计数点对点写给对端，接收端做前缀和得到分段偏移（全程无 CPU 参与）；</text>
<text x="1450" y="568" font-size="13" fill="#1a2332">③ token 本体按偏移写入对端接收缓冲，随后进入上图 grouped GEMM。</text>
<text x="1450" y="586" font-size="13" fill="#1a2332">COMBINE 展开：复用 dispatch 阶段的路由信息（handle），把各专家输出反向送回源 rank，</text>
<text x="1450" y="604" font-size="13" fill="#1a2332">在源 rank 按 gᵢ 加权求和——一对 all-to-all 即系统文献中的 token all-to-all。</text>
<text x="670" y="1523" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a2332">y = Σ_{i∈TopK} gᵢ(x)·Eᵢ(x) + E_shared(x)</text>
<text x="670" y="1578" font-size="13" text-anchor="middle" fill="#1a2332">红色：被 TopK 选中的 routed expert 及 dispatch/combine 通信通道；灰色：未选中专家；</text>
<text x="670" y="1596" font-size="13" text-anchor="middle" fill="#1a2332">绿色：本地计算（shared expert、加权求和）；蓝色：数据。专家权重全程不移动。</text>
