<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" font-family="Microsoft YaHei, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f9fd"/>
      <stop offset="100%" stop-color="#eef3fb"/>
    </linearGradient>
    <linearGradient id="shape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f83cc"/>
      <stop offset="100%" stop-color="#2f5fa3"/>
    </linearGradient>
    <linearGradient id="linear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43b0a5"/>
      <stop offset="100%" stop-color="#278a81"/>
    </linearGradient>
    <linearGradient id="act" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0a04b"/>
      <stop offset="100%" stop-color="#d47a1f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1c2430" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#5b6572"/>
    </marker>
  </defs>

  <rect width="1400" height="620" rx="24" fill="url(#bg)"/>
  <text x="700" y="55" text-anchor="middle" font-size="30" font-weight="700" fill="#16233a">MLP 的 Shape 流转：输入 → 扩维 → 激活 → 投影回原维</text>

  <!-- shape nodes -->
  <rect x="55" y="145" width="210" height="110" rx="16" fill="url(#shape)" filter="url(#shadow)"/>
  <text x="160" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">输入张量</text>
  <text x="160" y="220" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">[B, T, d_model]</text>

  <line x1="265" y1="200" x2="335" y2="200" stroke="#5b6572" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="340" y="110" width="220" height="180" rx="18" fill="url(#linear)" filter="url(#shadow)"/>
  <text x="450" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">Linear 1 / Up</text>
  <text x="450" y="183" text-anchor="middle" font-size="14" fill="#e8f7f1">W₁: [d_model, d_ff]</text>
  <text x="450" y="208" text-anchor="middle" font-size="14" fill="#e8f7f1">b₁: [d_ff]</text>
  <text x="450" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">扩维到 d_ff</text>

  <line x1="560" y1="200" x2="630" y2="200" stroke="#5b6572" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="635" y="145" width="210" height="110" rx="16" fill="url(#shape)" filter="url(#shadow)"/>
  <text x="740" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">隐藏状态</text>
  <text x="740" y="220" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">[B, T, d_ff]</text>

  <line x1="845" y1="200" x2="915" y2="200" stroke="#5b6572" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="920" y="120" width="200" height="160" rx="18" fill="url(#act)" filter="url(#shadow)"/>
  <text x="1020" y="160" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">Activation</text>
  <text x="1020" y="193" text-anchor="middle" font-size="14" fill="#fff4e2">ReLU / GELU</text>
  <text x="1020" y="218" text-anchor="middle" font-size="14" fill="#fff4e2">Swish / SiLU</text>
  <text x="1020" y="253" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">shape 不变</text>

  <line x1="1120" y1="200" x2="1190" y2="200" stroke="#5b6572" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1195" y="145" width="210" height="110" rx="16" fill="url(#shape)" filter="url(#shadow)"/>
  <text x="1300" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">激活后张量</text>
  <text x="1300" y="220" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">[B, T, d_ff]</text>

  <!-- bottom flow -->
  <line x1="1300" y1="255" x2="1300" y2="360" stroke="#5b6572" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1195" y="365" width="210" height="110" rx="16" fill="url(#linear)" filter="url(#shadow)"/>
  <text x="1300" y="408" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">Linear 2 / Down</text>
  <text x="1300" y="441" text-anchor="middle" font-size="14" fill="#e8f7f1">W₂: [d_ff, d_model]</text>
  <text x="1300" y="466" text-anchor="middle" font-size="14" fill="#e8f7f1">b₂: [d_model]</text>

  <line x1="1195" y1="420" x2="1090" y2="420" stroke="#5b6572" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="880" y="365" width="210" height="110" rx="16" fill="url(#shape)" filter="url(#shadow)"/>
  <text x="985" y="408" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">输出张量</text>
  <text x="985" y="440" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">[B, T, d_model]</text>

  <text x="985" y="520" text-anchor="middle" font-size="13" fill="#5b6572">典型 Transformer FFN：d_ff ≈ 4 × d_model</text>
  <text x="985" y="548" text-anchor="middle" font-size="13" fill="#5b6572">B = batch size，T = sequence length，d_model = 隐藏维度，d_ff = FFN 中间维度</text>
</svg>
